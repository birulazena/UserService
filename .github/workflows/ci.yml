name: CI Pipeline

on:
  push:
    branches:
      - CIPipeline

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build
        run: ./gradlew build -x test

      - name: Testing
        run: ./grablew test